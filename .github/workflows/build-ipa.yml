name: Build native IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Procursus ldid
        run: |
          set -euo pipefail
          # 注意：homebrew 的 ldid 对新 ld 产物嵌入 entitlements 会静默失败（blob 为空），
          # 必须使用 Procursus 官方 release 二进制。
          curl -sL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_macosx_arm64
          chmod +x /usr/local/bin/ldid
          ldid 2>&1 | head -1 || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          rm -rf DaysNote.xcodeproj
          xcodegen generate --spec project.yml
          xcodebuild -list -project DaysNote.xcodeproj

      - name: Archive (unsigned, device slice)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project DaysNote.xcodeproj \
            -scheme DaysNote \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/DaysNote.xcarchive" \
            -derivedDataPath "$PWD/.build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$PWD/DaysNote.xcarchive/Products/Applications/DaysNote.app"
          test -d "$APP"
          rm -rf "$PWD/.ipa-stage"
          mkdir -p "$PWD/.ipa-stage/Payload"
          cp -R "$APP" "$PWD/.ipa-stage/Payload/DaysNote.app"
          rm -f "$PWD/.ipa-stage/Payload/DaysNote.app/embedded.mobileprovision"
          # 关键：先移除 ld 的链接器签名，再用 codesign ad-hoc 重签并嵌入 entitlements。
          APPBIN="$PWD/.ipa-stage/Payload/DaysNote.app/DaysNote"
          WGBIN="$PWD/.ipa-stage/Payload/DaysNote.app/PlugIns/DaysNoteWidget.appex/DaysNoteWidget"
          codesign --remove-signature "$APPBIN" || true
          codesign --remove-signature "$WGBIN" || true
          codesign --force --sign - --generate-entitlement-der \
            --entitlements DaysNote/DaysNote.entitlements "$APPBIN"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements DaysNoteWidget/DaysNoteWidget.entitlements "$WGBIN"
          # 校验：entitlements 必须真正嵌入（DER 或 XML 槽位均算），否则小组件无法加载
          APPBIN="$PWD/.ipa-stage/Payload/DaysNote.app/DaysNote"
          WGBIN="$PWD/.ipa-stage/Payload/DaysNote.app/PlugIns/DaysNoteWidget.appex/DaysNoteWidget"
          echo "===== entitlement strings check ====="
          strings "$APPBIN" | grep -c application-groups || true
          strings "$WGBIN" | grep -c application-groups || true
          strings "$APPBIN" | grep -q application-groups || { echo "APP entitlements MISSING"; exit 1; }
          strings "$WGBIN" | grep -q application-groups || { echo "WIDGET entitlements MISSING"; exit 1; }
          echo "entitlements embedded OK"
          (cd "$PWD/.ipa-stage" && zip -qry "$PWD/DaysNote-native-unsigned.ipa" Payload)
          # zip 可能把绝对路径重建为嵌套目录，规整到根
          if [ ! -f "$PWD/DaysNote-native-unsigned.ipa" ] && [ -f "$PWD/.ipa-stage/DaysNote-native-unsigned.ipa" ]; then
            mv "$PWD/.ipa-stage/DaysNote-native-unsigned.ipa" "$PWD/DaysNote-native-unsigned.ipa"
          fi
          ls -lh "$PWD/DaysNote-native-unsigned.ipa"

      - name: Verify IPA
        run: |
          set -euo pipefail
          unzip -l DaysNote-native-unsigned.ipa | grep -E "Payload/DaysNote.app/DaysNote$|DaysNoteWidget.appex/DaysNoteWidget$|Info.plist" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DaysNote-native-unsigned
          path: DaysNote-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
